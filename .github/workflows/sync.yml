name: Sync source data
on:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install -r requirements-dev.txt
      - run: python sync/worldbank.py
      - run: python sync/openrouter.py
      - run: python -m pytest -q
      - name: Commit snapshot
        run: |
          git config user.name "data-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet || git commit -m "Sync source data $(date -u +%F)"
          git push
