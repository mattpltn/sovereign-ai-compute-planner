# Hardware profiles. Throughput = output tokens/s per GPU at a usable interactivity level, from independent benchmarks.
# Operating points: large reasoning model (L) at ~90-95 tokens/s per user; medium model (M) at ~75 tokens/s per user.
# Production derating (defaults.yaml) is applied on top: these are tuned benchmark results.
# Vendor claims (NVIDIA: 65x per GPU, 50x per MW, Hopper vs GB300) are not used as defaults; see docs/METHODOLOGY.md.
- id: P1
  name: HGX H200 8-GPU, air-cooled
  cooling: Air
  rack_kw: 41
  kw_per_gpu: 1.4
  gpu_hour_usd: 2.6
  capex_per_gpu_usd: 40000
  software_per_gpu_year_usd: 4500
  weak_grid_ok: true
  tokens_per_s_per_gpu:
    S: 8000
    M: 1930
    L: 779
  sources: [S44, S10, S11]
  evidence:
    L: "779 tok/s per GPU, DeepSeek R1 at 94 tok/s per user (SemiAnalysis InferenceX) (S44)."
    M: "1,930 tok/s per GPU, Llama 3.3 70B at 76 tok/s per user (S44)."
    S: "Derived: about 4x the 70B figure for an 8B model. Low confidence: calibrate with AIConfigurator."
    power: "1.4 kW per GPU all-in, implied by InferenceX tokens per MW for H200 (S44); DGX H200 server 10.2 kW per 8 GPUs (S10)."
    price: "GPU rental $2.60/hour (S11). Capex per GPU: placeholder, replace with vendor quote."
