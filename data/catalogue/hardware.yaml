# Hardware profiles. Throughput = output tokens/s per GPU from independent benchmarks, at three response-speed points:
#   low = fast (~130 tok/s per user for the large model, ~108 for 70B), base = standard (~90-95 / ~76),
#   high = relaxed (~50-60 / ~45). Setup -> "Response speed" picks the point.
# "measured" lists classes whose figures are measured benchmarks: used as is. Other classes are derived and derated.
# Vendor claims (NVIDIA: 65x per GPU, 50x per MW, Hopper vs GB300) are not used as defaults; see docs/METHODOLOGY.md.
- id: P1
  name: HGX H200 8-GPU, air-cooled
  cooling: Air
  rack_kw: 41
  kw_per_gpu: 1.4
  gpu_hour_usd: 2.6
  capex_per_gpu_usd: 40000
  software_per_gpu_year_usd: 4500
  weak_grid_ok: true
  measured:
  - L
  - M
  tokens_per_s_per_gpu:
    S:
      low: 5000
      base: 8000
      high: 12000
    M:
      low: 1152
      base: 1930
      high: 2978
    L:
      low: 611
      base: 779
      high: 1302
  sources:
  - S44
  - S10
  - S11
  evidence:
    L: 'DeepSeek R1: 611 / 779 / 1,302 tok/s per GPU at 130 / 94 / 57 tok/s per user (SemiAnalysis InferenceX) (S44).'
    M: 'Llama 3.3 70B: 1,152 / 1,930 / 2,978 tok/s per GPU at 108 / 76 / 45 tok/s per user (S44).'
    S: 'Derived: about 4x the 70B figure for an 8B model. Low confidence: derated and to calibrate with AIConfigurator.'
    power: 1.4 kW per GPU all-in, implied by InferenceX tokens per MW for H200 (S44). The DGX H200 server alone is 10.2 kW per 8 GPUs = 1.275 kW (S10); the difference is the share of networking, storage and management.
    price: 'GPU rental $2.60/hour, market rental (S11). NVIDIA''s $1.41 (S02) and SemiAnalysis''s $1.22 (S44) are ownership costs per chip-hour, not rental prices; they are used only as ratios between profiles. Capex per GPU:
      placeholder, replace with vendor quote.'
