- id: P2
  name: GB300 NVL72, liquid-cooled rack
  cooling: Liquid
  rack_kw: 130
  kw_per_gpu: 2.1
  gpu_hour_usd: 4.92
  capex_per_gpu_usd: 65000
  software_per_gpu_year_usd: 4500
  weak_grid_ok: false
  measured:
  - L
  tokens_per_s_per_gpu:
    S:
      low: 12000
      base: 16000
      high: 18370
    M:
      low: 3000
      base: 5000
      high: 7800
    L:
      low: 3404
      base: 5667
      high: 8552
  sources:
  - S44
  - S45
  - S02
  evidence:
    L: 'DeepSeek R1: 3,404 / 5,667 / 8,552 tok/s per GPU at 130 / 94 / 57 tok/s per user (S44): 5.6-7.3x H200 at the same interactivity. NVIDIA''s own comparison (6,000 vs 90, 65x) uses an operating point where H200 barely
      runs (S02).'
    M: 'Derived: B200 70B figures x ~1.3 for Blackwell Ultra; a dense 70B model gains little from the 72-GPU NVLink domain. Low confidence: derated. Lower than L is not an error: L is a mixture-of-experts model with ~37B active
      parameters per token, so on a 72-GPU NVLink rack it can generate faster than a dense 70B model (InferenceX: gpt-oss 120B reaches >40,000 tok/s per GPU on GB200) (S44).'
    S: 'MLPerf Inference v5.1 Llama 3.1 8B: 16,099 tok/s per GPU server, 18,370 offline (S45); low is an assumption. Derated (not at a fixed interactivity).'
    power: 2.1 kW per GPU, implied by NVIDIA's 2.8M tok/s per MW at 6,000 tok/s per GPU (S02).
    price: 'Rental scaled from H200 by the SemiAnalysis ownership cost ratio, $2.31 vs $1.22 per chip-hour (S44); NVIDIA gives a similar 1.9x ratio (S02). Capex: placeholder.'
