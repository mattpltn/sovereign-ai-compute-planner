# Global defaults. Maintainers update yearly; users override only via "client quotes".
# Each entry: value, and for cost items low/base/high for the TCO range.
global_egdi_average: {value: 0.638, source: S17, note: "UN E-Government Survey 2024 world average"}
facility_mode: {value: country, source: method, note: "country: PUE and facility cost by country, region and cooling (facility.yaml); flat: v0.1 single values"}
pue: {value: 1.6, source: S22, note: "Used only in flat mode (v0.1 parity)"}
diversity_mode: {value: scaled, source: method, note: "scaled: D depends on the number of applications in the tier; fixed: v0.1 constant"}
diversity_factor: {value: 0.7, source: method, note: "Used only in fixed mode (v0.1 parity)"}
diversity_factor_min: {value: 0.6, source: assumption, note: "Floor of D for many applications. D(n) = D_min + (1 - D_min) / sqrt(n); D = 1 for a single application"}
production_derating: {value: 0.6, source: "S11, S06", note: "Applied only to derived or placeholder throughput figures and non-LLM GPU-seconds, not to measured benchmark figures"}
prefill_weight: {value: 0.15, source: "S03, S07", note: "Cost of an uncached input token relative to an output token"}
idle_power_fraction: {value: 0.3, source: "S09, S10", note: "Share of rated IT power drawn when idle"}
horizon_years: {value: 10, source: "-", note: "Analysis horizon"}
discount_rate: {value: 0.08, source: assumption, note: "Real discount rate for present value; 6-10% is a common range for public infrastructure appraisal. User input"}
demand_growth: {value: 0.0, source: user, note: "Annual growth of requests. User input"}
price_decline: {value: 0.0, source: user, note: "Annual decline of market prices (API tokens, GPU rental, GPU capex at refresh). User input"}
throughput_uncertainty: {low: 1.3, base: 1.0, high: 0.75, source: "S44", note: "Multiplier on tokens/s per GPU in the Low / Base / High cost cases: serving software, batching and model mix. InferenceX results for one chip at one interactivity vary by more than this across frameworks"}
gpu_threshold: {value: 0.25, source: assumption, note: "Tiers with only non-LLM workloads needing less than this many GPUs run on existing servers"}
tokens_per_user_day_ceiling: {value: 240000, source: S24, note: "Epoch AI human-equivalent ceiling"}
weak_grid_outages_threshold: {value: 1, source: analyst, note: "Outages per month above which liquid-cooled dense racks are excluded"}
weak_grid_firm_share_threshold: {value: 0.5, source: "assumption (confidence Low), S19", note: "Fallback when outages per month are missing: grid treated as weak if at least this share of firms experienced outages (Enterprise Surveys)"}
step1_max_facility_mw: {value: 1, source: analyst, note: "Below this, a sovereign tier fits in an existing facility"}
step3_min_facility_mw: {value: 10, source: assumption, note: "From this size, a dedicated facility via PPP or private operator is realistic; between 1 and 10 MW, colocation in an existing commercial data centre"}
dense_profile_min_it_mw: {value: 1, source: analyst, note: "Below this IT load, a 130 kW liquid-cooled rack is not worth it; use air-cooled"}
maintenance_share: {value: 0.05, source: analyst, note: "Share of capex per year"}
staff_mode: {value: scaled, source: method, note: "scaled: FTE = minimum + GPUs / GPUs per FTE; flat: v0.1 constant"}
fte_min: {value: 2, source: assumption, note: "Operations staff per owned site (one site per tier)"}
gpus_per_fte: {value: 100, source: assumption, note: "One additional FTE per ~100 GPUs"}
fte_per_owned_tier: {value: 4, source: analyst, note: "Used only in flat mode (v0.1 parity)"}
cost_per_fte_usd: {value: 60000, source: analyst, note: "Local market; override if known"}
gpu_refresh_years: {value: 5, source: S03}

# Cost items with ranges (low / base / high). Overridden by client quotes.
costs:
  electricity_usd_kwh: {low: 0.10, base: 0.15, high: 0.25, source: S20, note: "Used only if the country snapshot has no tariff"}
  facility_capex_usd_per_mw_it: {low: 8000000, base: 11000000, high: 15000000, source: S23, note: "Used only in flat mode; country mode uses facility.yaml"}
  gpu_capex_multiplier: {low: 0.8, base: 1.0, high: 1.3, source: analyst, note: "Applied to hardware profile capex per GPU"}
  gpu_hour_multiplier: {low: 0.7, base: 1.0, high: 1.5, source: S11, note: "Applied to hardware profile $/GPU-hour; local providers price higher"}
  api_price_multiplier: {low: 0.7, base: 1.0, high: 1.5, source: S21, note: "Applied to synced API prices; residency premium in high case"}
  cached_input_price_share: {low: 0.1, base: 0.25, high: 0.5, source: "S46, S47", note: "Price of a cached input token as a share of the normal input price"}

# API prices per model class, $ per million tokens. Overwritten by data/snapshots/api_prices.json when present.
api_prices_fallback:
  S: {input: 0.10, output: 0.40}
  M: {input: 0.50, output: 1.50}
  L: {input: 1.00, output: 4.00}

# OpenRouter model id prefixes used to compute the median price per class (sync/openrouter.py).
# A prefix matches every listed version (e.g. deepseek/deepseek-r1 matches deepseek/deepseek-r1-0528).
api_reference_models:
  S: [meta-llama/llama-3.1-8b-instruct, qwen/qwen-2.5-7b-instruct, mistralai/mistral-7b-instruct, qwen/qwen3-8b]
  M: [meta-llama/llama-3.3-70b-instruct, qwen/qwen-2.5-72b-instruct, qwen/qwen3-32b]
  L: [deepseek/deepseek-r1, deepseek/deepseek-v3, deepseek/deepseek-chat, qwen/qwen3-235b, moonshotai/kimi-k2]

# Default mapping data class -> tier (World Bank data classification approach, S14). Users can change it per country.
class_to_tier: {1: T1, 2: T2, 3: T3, 4: T4}
tiers:
  T1: {name: "Offshore cloud or API", api: true, gpuaas: true, owned: true}
  T2: {name: "Cloud with data residency (in-country or regional)", api: true, gpuaas: true, owned: true}
  T3: {name: "In-country, private provider (government data centre if none)", api: false, gpuaas: true, owned: true}
  T4: {name: "Government data centre", api: false, gpuaas: false, owned: true}
agri_volume_tolerance: {value: 1.5, source: "assumption (confidence Low)", note: "Agriculture advisory volume check: warn above this multiple of estimated agricultural workers (ILO modeled employment counts workers, not holdings or households; household members may also use the service)"}
facility_buffer: {value: 0.30, source: "analyst (best practice)", note: "Own data centre: built with 30% spare capacity above the peak installed IT load"}
api_price_decline: {value: 0.20, source: "assumption (confidence Low), S82, S83", note: "Yearly fall in API token and per-unit API prices for the model tier chosen. Prices for a fixed capability fall about 10x per year (S82, S83), but clients move to newer, more capable models, so the bill per token for a chosen tier falls far less. 20% is a conservative planning value"}
hw_price_decline: {value: 0.0, source: "S84", note: "Yearly fall in GPU rental and GPU server prices. H100 rental fell more than 60% in 2025 and then rose about 40% between October 2025 and March 2026 (S84): no stable trend, so 0% by default"}
compute_gain_per_year: {value: 0.25, source: "S86, S87, assumption (confidence Medium)", note: "Yearly gain in inference work per GPU for hardware bought or rented later, at the same price per GPU. Epoch AI: FLOP/s per dollar of ML GPUs doubles every 2.07 years, about +40% per year (S86); memory bandwidth doubles every ~4.1 years, about +18% per year (S87). LLM decoding is mostly memory-bound, so 25% is taken between the two"}
owned_infra_share: {value: 0.15, source: "S85, assumption (confidence Medium)", note: "Owned options: network switches, storage, firewalls and security appliances (incl. key management), bought with each server batch, as a share of the GPU server price. AI cluster bills of materials put networking at 10-25% of capex (S85); a small inference deployment needs little storage"}

# ---------------------------------------------------------------- v0.9.11: price references and ownership options
api_reference: {value: hyperscaler, source: "S109, S110, S111", note: "Which API prices the API option uses. hyperscaler (default): open models on a hyperscaler in a regional data centre, as most governments would buy. open_market: synced median of the same open models on OpenRouter (S21), the cheapest. frontier: proprietary frontier models (GPT-5.4 family) with the 10% regional-processing uplift"}
api_reference_prices:
  hyperscaler:
    S: {input: 0.15, output: 0.15}     # Ministral 8B, Amazon Bedrock (S109): same size as the 8B used for sizing
    M: {input: 0.72, output: 0.72}     # Llama 3.3 70B Instruct, Amazon Bedrock (S109): the model used for sizing
    L: {input: 0.74, output: 2.22}     # DeepSeek v3.2, Bedrock Mumbai / Sao Paulo / Jakarta / Tokyo / Stockholm (S109)
    source: "S109"
  frontier:
    S: {input: 0.20, output: 1.25}     # GPT-5.4 nano (S110)
    M: {input: 0.75, output: 4.50}     # GPT-5.4 mini (S110)
    L: {input: 2.50, output: 15.00}    # GPT-5.4 (S110); Claude Sonnet 5 is $3 / $15 (S109)
    regional_uplift: 0.10              # regional processing (data residency) endpoints, +10% (S110)
    source: "S110, S109"
api_commit_discount: {value: 0.0, source: "S111, client", note: "Discount negotiated for a multi-year API commitment. 0 by default: published discounts apply to reserved capacity (Azure provisioned reservations: up to 64% monthly, 70% yearly, against the hourly provisioned rate, S111), not to the per-token price. Set it from a real offer"}
gpu_rental_reference: {value: hyperscaler, source: "S112, S113, S11", note: "hyperscaler (default): Azure or AWS, as most governments would rent. neocloud: specialised GPU cloud, the hardware profile price"}
gpu_rental_mode: {value: reserved, source: "S112, S113", note: "reserved: GPUs rented all year on a 1-year commitment (24/7). on_demand: rented only for the hours of work, at the on-demand price"}
gpu_rental_multipliers:
  value:
    neocloud: {reserved: 1.0, on_demand: 1.0}
    hyperscaler: {reserved: 2.216, on_demand: 3.56}
  source: "S112, S113, S11"
  note: "Multiple of the hardware profile price (neocloud H200 $2.60, S11). Hyperscaler H200 on demand: Azure ND H200 v5 $84.80 per 8-GPU hour = $10.60 per GPU-hour (S112); AWS p5en $63.296 = $7.91 (S113); average $9.255 = 3.56x. Reserved 1 year: Azure 1-year reservation -35% (ND H100 v5 $7.93 vs $12.29, S112), AWS 1-year savings plan up to -40% (S113); average -37.75%, $5.76 = 2.216x. Applied to every hardware profile (assumption for B200 and GB300)"
on_demand_utilisation: {value: 0.6, source: "assumption (confidence Low)", note: "On-demand GPUs are billed for the hours of work divided by this share: autoscaling keeps headroom and GPUs start before the load arrives"}
software_stack: {value: nvidia, source: "S115, assumption", note: "nvidia (default): NVIDIA AI Enterprise licence per GPU per year, the usual choice where serving skills are scarce. open_source: vLLM / SGLang on Kubernetes, no licence fee (staff unchanged)"}
server_life_years: {value: 8, source: "S114, assumption (confidence Low)", note: "Servers are kept in service this long, not sold. After the 5-year refresh period they stay out of warranty and new servers are only bought when the need exceeds what is installed. Hyperscalers depreciate servers over 6 years (S114) and the hardware physically lasts longer; 8 is an assumption for governments. Set 5 to replace at the refresh period (v0.9.10 behaviour)"}
maintenance_after_warranty_multiplier: {value: 2.0, source: "assumption (confidence Low)", note: "Maintenance share of capex for servers past the refresh period (out of warranty): 2x the 5% per year"}
idle_sharing_share: {value: 0.0, source: "option", note: "Share of idle GPU-hours of owned or reserved GPUs opened to universities and research at night and weekends. 0 = off"}
idle_sharing_price_share: {value: 0.5, source: "assumption (confidence Low)", note: "Value of a shared GPU-hour as a share of the neocloud rental price: what universities would pay at an academic rate, or the cost they avoid"}
