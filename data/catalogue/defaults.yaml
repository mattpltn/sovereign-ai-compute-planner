# Global defaults. Maintainers update yearly; users override only via "client quotes".
# Each entry: value, and for cost items low/base/high for the TCO range.
global_egdi_average: {value: 0.638, source: S17, note: "UN E-Government Survey 2024 world average"}
facility_mode: {value: country, source: method, note: "country: PUE and facility cost by country, region and cooling (facility.yaml); flat: v0.1 single values"}
pue: {value: 1.6, source: S22, note: "Used only in flat mode (v0.1 parity)"}
diversity_mode: {value: scaled, source: method, note: "scaled: D depends on the number of applications in the tier; fixed: v0.1 constant"}
diversity_factor: {value: 0.7, source: method, note: "Used only in fixed mode (v0.1 parity)"}
diversity_factor_min: {value: 0.6, source: assumption, note: "Floor of D for many applications. D(n) = D_min + (1 - D_min) / sqrt(n); D = 1 for a single application"}
production_derating: {value: 0.6, source: "S11, S06", note: "Applied only to derived or placeholder throughput figures and non-LLM GPU-seconds, not to measured benchmark figures"}
prefill_weight: {value: 0.15, source: "S03, S07", note: "Cost of an uncached input token relative to an output token"}
idle_power_fraction: {value: 0.3, source: "S09, S10", note: "Share of rated IT power drawn when idle"}
horizon_years: {value: 10, source: "-", note: "Analysis horizon"}
discount_rate: {value: 0.08, source: assumption, note: "Real discount rate for present value; 6-10% is a common range for public infrastructure appraisal. User input"}
demand_growth: {value: 0.0, source: user, note: "Annual growth of requests. User input"}
price_decline: {value: 0.0, source: user, note: "Annual decline of market prices (API tokens, GPU rental, GPU capex at refresh). User input"}
throughput_uncertainty: {low: 1.3, base: 1.0, high: 0.75, source: "S44", note: "Multiplier on tokens/s per GPU in the Low / Base / High cost cases: serving software, batching and model mix. InferenceX results for one chip at one interactivity vary by more than this across frameworks"}
gpu_threshold: {value: 0.25, source: assumption, note: "Tiers with only non-LLM workloads needing less than this many GPUs run on existing servers"}
tokens_per_user_day_ceiling: {value: 240000, source: S24, note: "Epoch AI human-equivalent ceiling"}
weak_grid_outages_threshold: {value: 1, source: analyst, note: "Outages per month above which liquid-cooled dense racks are excluded"}
weak_grid_firm_share_threshold: {value: 0.5, source: "assumption (confidence Low), S19", note: "Fallback when outages per month are missing: grid treated as weak if at least this share of firms experienced outages (Enterprise Surveys)"}
step1_max_facility_mw: {value: 1, source: analyst, note: "Below this, a sovereign tier fits in an existing facility"}
step3_min_facility_mw: {value: 10, source: assumption, note: "From this size, a dedicated facility via PPP or private operator is realistic; between 1 and 10 MW, colocation in an existing commercial data centre"}
dense_profile_min_it_mw: {value: 1, source: analyst, note: "Below this IT load, a 130 kW liquid-cooled rack is not worth it; use air-cooled"}
maintenance_share: {value: 0.05, source: analyst, note: "Share of capex per year"}
staff_mode: {value: scaled, source: method, note: "scaled: FTE = minimum + GPUs / GPUs per FTE; flat: v0.1 constant"}
fte_min: {value: 2, source: assumption, note: "Operations staff per owned site (one site per tier)"}
gpus_per_fte: {value: 100, source: assumption, note: "One additional FTE per ~100 GPUs"}
fte_per_owned_tier: {value: 4, source: analyst, note: "Used only in flat mode (v0.1 parity)"}
cost_per_fte_usd: {value: 60000, source: analyst, note: "Local market; override if known"}
gpu_refresh_years: {value: 5, source: S03}

# Cost items with ranges (low / base / high). Overridden by client quotes.
costs:
  electricity_usd_kwh: {low: 0.10, base: 0.15, high: 0.25, source: S20, note: "Used only if the country snapshot has no tariff"}
  facility_capex_usd_per_mw_it: {low: 8000000, base: 11000000, high: 15000000, source: S23, note: "Used only in flat mode; country mode uses facility.yaml"}
  gpu_capex_multiplier: {low: 0.8, base: 1.0, high: 1.3, source: analyst, note: "Applied to hardware profile capex per GPU"}
  gpu_hour_multiplier: {low: 0.7, base: 1.0, high: 1.5, source: S11, note: "Applied to hardware profile $/GPU-hour; local providers price higher"}
  api_price_multiplier: {low: 0.7, base: 1.0, high: 1.5, source: S21, note: "Applied to synced API prices; residency premium in high case"}
  cached_input_price_share: {low: 0.1, base: 0.25, high: 0.5, source: "S46, S47", note: "Price of a cached input token as a share of the normal input price"}

# API prices per model class, $ per million tokens. Overwritten by data/snapshots/api_prices.json when present.
api_prices_fallback:
  S: {input: 0.10, output: 0.40}
  M: {input: 0.50, output: 1.50}
  L: {input: 1.00, output: 4.00}

# OpenRouter model id prefixes used to compute the median price per class (sync/openrouter.py).
# A prefix matches every listed version (e.g. deepseek/deepseek-r1 matches deepseek/deepseek-r1-0528).
api_reference_models:
  S: [meta-llama/llama-3.1-8b-instruct, qwen/qwen-2.5-7b-instruct, mistralai/mistral-7b-instruct, qwen/qwen3-8b]
  M: [meta-llama/llama-3.3-70b-instruct, qwen/qwen-2.5-72b-instruct, qwen/qwen3-32b]
  L: [deepseek/deepseek-r1, deepseek/deepseek-v3, deepseek/deepseek-chat, qwen/qwen3-235b, moonshotai/kimi-k2]

# Default mapping data class -> tier (World Bank data classification approach, S14). Users can change it per country.
class_to_tier: {1: T1, 2: T2, 3: T3, 4: T4}
tiers:
  T1: {name: "Public cloud / API, offshore permitted", api: true, gpuaas: true, owned: true}
  T2: {name: "Cloud with in-country or regional residency", api: true, gpuaas: true, owned: true}
  T3: {name: "Sovereign local, privately operated", api: false, gpuaas: true, owned: true}
  T4: {name: "Government enclave, state-operated", api: false, gpuaas: false, owned: true}
agri_volume_tolerance: {value: 1.5, source: "assumption (confidence Low)", note: "Agriculture advisory volume check: warn above this multiple of estimated agricultural workers (ILO modeled employment counts workers, not holdings or households; household members may also use the service)"}
