  - S39
  - S42
  note: Eligible share = desk-based staff. Check against US Army allowance of 200k tokens/user/month [S26].
  confidence:
    volume: Medium
    tokens: Medium
  evidence:
    eligible_share: '30% of civil servants are desk-based knowledge workers: analyst assumption, replace with HR data.'
    adoption: 'Low 0.15 / Base 0.33 / High 0.80. Base: Singapore Pair, ~50,000 regular users of ~150,000 public officers (S38). High: UK GDS trial, ~80% of licensed staff active in the last 30 days (S36). Low: half of Base.'
    tasks: '3.6 messages per weekly active user per day: ChatGPT ~2.5-2.6 billion messages/day for ~700 million weekly users (S39). Consistent with UK trial (39% used it several times a day) and Australian trial (1 in 3 daily)
      (S36, S37).'
    tokens: Input 2,000 + system prompt 1,000, output 400. Azure production chat median 1,020 in / 129 out in 2023 (S31); OpenRouter average >6,000 in / ~400 out by late 2025, driven by longer context (S32). Work copilots
      attach documents, so input sits between the two.
    cache: 'System-prompt cache hit 50%: Kimi/Mooncake production trace reports up to 50% cache hit (S34). Agentic coding reaches ~94% (S42), not assumed here.'
    burst: 'Burst 2.0, SLA headroom 1.1: production LLM traffic is bursty, API traffic more than chat (S33). Headroom reduced from 1.2 to avoid double counting with burst.'
    peak: 'Peak share and window: office-hours logic (no public government trace). Analyst assumption, low confidence.'
