# Use-case catalogue. Every default carries its evidence and a confidence level (volume, tokens).
# Volume = how many tasks per day. Tokens = size of each task. See docs/DEFAULTS.md.
- id: UC01
  name: Citizen services assistant (multilingual chat)
  category: Chatbot
  include: 1
  stage: Production
  driver: Population
  eligible_share: 1
  fixed_base: 0
  pilot_users: 500
  adoption_low: 0.0045
  adoption_base: 0.011
  adoption_high: 0.045
  citizen_facing: 1
  tasks_per_user_day: 0.1
  isl: 1500
  osl: 300
  reasoning_tokens: 0
  agent_steps: 1
  retry: 1.1
  system_prompt_tokens: 800
  cache_hit: 0.5
  peak_share: 0.6
  peak_window_h: 10
  burst: 2
  sla_headroom: 1.1
  seasonal: 1.5
  model_class: M
  data_class: 2
  sources:
  - S01
  - S07
  - S31
  - S32
  - S33
  - S34
  - S40
  - S42
  note: Sporadic use (~3 queries/month per adopter). ISL includes retrieved context (RAG).
  confidence:
    volume: Medium
    tokens: Medium
  evidence:
    adoption: 'Calibrated as queries per 10,000 people per day (at 45% internet use and 0.1 tasks per active user). Low 2 / Base 5 / High 20. Anchor: India''s Kisan e-Mitra answers 8,000-20,000 queries/day for ~93 million
      PM-KISAN beneficiaries, i.e. ~1-2 per 10,000 per day (S40). A multi-service assistant is assumed to sit above a single-scheme bot.'
    tokens: Input 1,500 (question + retrieved context) + system 800, output 300. Azure production chat median 1,020 in / 129 out (S31); OpenRouter average completion ~400 (S32).
    cache: 'System-prompt cache hit 50%: Kimi/Mooncake production trace reports up to 50% cache hit (S34). Agentic coding reaches ~94% (S42), not assumed here.'
    burst: 'Burst 2.0, SLA headroom 1.1: production LLM traffic is bursty, API traffic more than chat (S33). Headroom reduced from 1.2 to avoid double counting with burst.'
    peak: 'Peak share and window: office-hours logic (no public government trace). Analyst assumption, low confidence.'
